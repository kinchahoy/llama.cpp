; llama-server router presets for two gfx906 GPUs (ROCm0 MI60 + ROCm1 MI50), 32 GiB each, tensor parallel.
; Start with vr/server/serve.sh (build-mslot-ring); pick a model per request with "model": "<section name>".
; Only one model fits at a time (--models-max 1); switching presets reloads the model.
; Slots share one unified KV pool, so ctx-size is the total across users; one request may use all of it.
; Context sizes are the largest that served a ~90% pool fill and concurrent users with a safe VRAM margin (2026-11-11).
; Evidence: vr/investigation-notes/2026-11-11-multiuser-serving and 2026-11-11-multislot-rollback.
version = 1

[*]
n-gpu-layers = 999
device = ROCm0,ROCm1
split-mode = tensor
flash-attn = on
threads = 20
parallel = 1
fit = off

; Qwen3.8-27B Q8_0, MTP2, 4 users, 262144-token pool (the model's native maximum per request).
; One user alone about 65 t/s, 4 at once about 41 t/s total, prompt about 590 t/s. 200K-token prompt verified (28 t/s generation).
; About 1.3 GiB free per GPU. Default choice.
[qwen27b]
model = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-Q8_0.gguf
batch-size = 2048
ubatch-size = 2048
ctx-size = 262144
parallel = 4
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-backend-sampling = true
load-on-startup = true

; Same model with the DFlash2 draft, 5 draft tokens, single user: about 69 t/s on short prompts; long prompts pay a draft replay before the first tokens.
; Multi-slot DFlash is not validated (4 slots fit only at 180K with 0.4 GiB free on ROCm0).
[qwen27b-dflash]
model = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-Q8_0.gguf
model-draft = /home/raistlin/.cache/huggingface/hub/models--z-lab--Qwen3.8-27B-DFlash2-GGUF/snapshots/2d9571f8ce46e151f61c6499c99dee6079e1d610/Qwen3.8-27B-DFlash2-Q8_0.gguf
batch-size = 2048
ubatch-size = 2048
ctx-size = 32768
spec-type = draft-dflash
spec-draft-n-max = 5

; Qwen3.8 Flash Next UD-IQ3_XXS (MoE) with the Q8_0 n-gram table, MTP3 with the Q8_0 sidecar on ROCm1, 2 users, 90112-token pool.
; ubatch 384: same prompt speed as 512 (llama-bench PP2048 599.6 vs 598.2) with smaller buffers; 256 costs 10%, 448 is slower.
; One user alone about 65 t/s, prompt about 470 t/s. Verified: 81K-token single prompt, and 2 x 30K prompts at once (both answered).
; While one user prefills a long prompt, the other user's generation crawls (about 1 t/s) until that prefill ends.
; Tight by choice: 98K at ubatch 384 died on its first requests; if this ever aborts with out of memory, use ubatch 512 + ctx 65536.
; Moving the draft to ROCm0 does not help (tensor split moves in coarse steps). Needs build-mslot-ring or later (multi-slot rollback).
[flashnext]
model = /home/raistlin/models/flashnext/UD-IQ3_XXS/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00004.gguf
model-draft = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/d96201194f103c906994f283f504209dc8d2a10c/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
device-draft = ROCm1
tensor-split = 0.52,0.48
batch-size = 1024
ubatch-size = 384
ctx-size = 90112
parallel = 2
kv-unified = true
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-n-ubatch = 64
spec-draft-backend-sampling = true

; Flash Next for long context or 4 busy users: no draft, 4 users, 131072-token pool.
; One user alone about 48 t/s, 4 at once about 41 t/s total. 120K-token prompt verified (29 t/s generation).
; 160K also ran but left about 0.2 GiB free on ROCm1; 196K and 262K ran out of memory.
[flashnext-long]
model = /home/raistlin/models/flashnext/UD-IQ3_XXS/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00004.gguf
tensor-split = 0.47,0.53
batch-size = 1024
ubatch-size = 512
ctx-size = 131072
parallel = 4
kv-unified = true

