; llama-server router presets for two gfx906 GPUs (ROCm0 MI60 + ROCm1 MI50), tensor parallel.
; Start with vr/server/serve.sh; pick a model per request with "model": "<section name>".
; Settings follow vr/PERFORMANCE.md and vr/TOKEN-BUDGET.md (2026-11-10). Only one model fits at a time (--models-max 1).
version = 1

[*]
n-gpu-layers = 999
device = ROCm0,ROCm1
split-mode = tensor
flash-attn = on
threads = 20
parallel = 1
fit = off

; Qwen3.8-27B Q8_0 with its built-in MTP head, 2 draft tokens: about 62 t/s generation, fast first token. Default choice.
[qwen27b]
model = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-Q8_0.gguf
batch-size = 2048
ubatch-size = 2048
ctx-size = 32768
spec-type = draft-mtp
spec-draft-n-max = 2
spec-draft-backend-sampling = true
load-on-startup = true

; Same model with the DFlash2 draft, 5 draft tokens: about 69 t/s on short prompts; long prompts pay a draft replay before the first tokens.
[qwen27b-dflash]
model = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-27B-GGUF/snapshots/4ca720788d1e01f1bff70c033e0d0028fd02e502/Qwen3.8-27B-Q8_0.gguf
model-draft = /home/raistlin/.cache/huggingface/hub/models--z-lab--Qwen3.8-27B-DFlash2-GGUF/snapshots/2d9571f8ce46e151f61c6499c99dee6079e1d610/Qwen3.8-27B-DFlash2-Q8_0.gguf
batch-size = 2048
ubatch-size = 2048
ctx-size = 32768
spec-type = draft-dflash
spec-draft-n-max = 5

; Qwen3.8 Flash Next UD-IQ3_XXS (MoE) with the Q8_0 MTP sidecar on ROCm1, 3 draft tokens, 100K context: about 62 t/s server generation.
[flashnext]
model = /home/raistlin/models/flashnext/UD-IQ3_XXS/Qwen3.8-Flash-Next-UD-IQ3_XXS-00001-of-00004.gguf
model-draft = /home/raistlin/.cache/huggingface/hub/models--unsloth--Qwen3.8-Flash-Next-GGUF/snapshots/d96201194f103c906994f283f504209dc8d2a10c/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
device-draft = ROCm1
tensor-split = 0.52,0.48
batch-size = 1024
ubatch-size = 512
ctx-size = 100352
spec-type = draft-mtp
spec-draft-n-max = 3
spec-draft-n-ubatch = 64
spec-draft-backend-sampling = true

; Gemma 4 31B-it Q8_0, no speculative draft: about 33 t/s generation, 600 t/s prompt.
[gemma4]
model = /home/raistlin/.cache/huggingface/hub/models--unsloth--gemma-4-31B-it-GGUF/snapshots/c1ac76e99d5513b141e8adde7288b85c3f9c32ec/gemma-4-31B-it-Q8_0.gguf
batch-size = 2048
ubatch-size = 2048
ctx-size = 32768
